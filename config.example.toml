# Every path here is a path as THIS app sees it, after Docker bind-mounts,
# except path_mappings.from, which is a path as qBittorrent sees it.

[qbittorrent]
url = "http://qbittorrent:8080"
username = "admin"
# Password is read from QUF_QBITTORRENT__PASSWORD and never stored in this file.

# Rewrites qBittorrent's paths to this app's view. First matching prefix
# wins; list longer prefixes first.
[[qbittorrent.path_mappings]]
from = "/config/qBittorrent/downloads"
to = "/data/downloads"

[scan]
downloads_root = "/data/downloads"
# Optional. Excluded from scanning.
#incomplete_dir = "/data/downloads/.incomplete"
# Full rescan interval in seconds.
rescan_interval_seconds = 900

# One block per destination root. Optional categories preselect this root
# in the hardlink dialog for those qBittorrent categories.
[[destination_roots]]
path = "/data/Media/Movies"
label = "Movies"
categories = ["movies"]

[[destination_roots]]
path = "/data/Media/TV-Shows"
label = "TV"
categories = ["tv-shows"]

[server]
# Host names/addresses this app may be reached at; others are rejected.
allowed_hosts = ["localhost", "127.0.0.1", "nas.local"]
