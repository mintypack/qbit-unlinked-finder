[project]
name = "qbit-unlinked-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "qbittorrent-api>=2024.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
